<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Avenqis Labs</title>
  <meta name="description" content="Get in touch with Avenqis Labs to talk about your next software project." />
  <link rel="icon" href="assets/logo-mark.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/contact.css" />
</head>
<body data-page="contact">

  <div id="site-header"></div>

  <main>
    <section class="page-header">
      <div class="container">
        <h1>Let's build something together</h1>
        <p>Tell us about your project and we'll get back to you shortly.</p>
      </div>
    </section>

    <section>
      <div class="container contact-layout">
        <div class="contact-info">
          <h2>Contact details</h2>
          <div class="contact-info-item">
            <span>Email</span>
            <a href="mailto:hello@avenqislabs.in">hello@avenqislabs.in</a>
          </div>
          <div class="contact-info-item">
            <span>Website</span>
            <a href="https://avenqislabs.in">avenqislabs.in</a>
          </div>
          <div class="contact-info-item">
            <span>Response time</span>
            <p>We usually reply within 1–2 business days.</p>
          </div>
        </div>

        <form class="contact-form" id="contactForm">
          <div class="form-row">
            <input type="text" name="name" placeholder="Your name" required />
            <input type="email" name="email" placeholder="Your email" required />
          </div>
          <textarea name="message" rows="5" placeholder="Tell us about your project" required></textarea>
          <button type="submit" class="btn btn-primary">Send message <span aria-hidden="true">&rarr;</span></button>
        </form>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="js/partials.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/contact-form.js"></script>
</body>
</html>
